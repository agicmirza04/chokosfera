name: Deploy to Render

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install
        run: npm install

      - name: Build Docker image
        run: |
          docker build -t chokosfera:latest .

      - name: Push & Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "Triggering Render deploy via API"
          
          # Validate credentials exist
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "Error: RENDER_API_KEY or RENDER_SERVICE_ID not set"
            exit 1
          fi
          
          # Make API call and capture full response for debugging
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"serviceId": "'$RENDER_SERVICE_ID'"}' \
            https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys)
          
          echo "API Response: $RESPONSE"
          
          # Extract deploy ID safely
          DEPLOY_ID=$(echo "$RESPONSE" | jq -r '.id // empty')
          
          if [ -z "$DEPLOY_ID" ]; then
            echo "Error: Failed to extract deploy ID from response"
            echo "$RESPONSE" | jq '.'
            exit 1
          fi
          
          echo "Started deploy: $DEPLOY_ID"
