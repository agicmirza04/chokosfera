name: Deploy to Railway

on:
  push:
    branches: [ main, master ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          NODE_ENV: production
          PORT: 3000
        run: |
          # Validate token exists
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "Error: RAILWAY_TOKEN secret is not set"
            echo "Please add RAILWAY_TOKEN to GitHub Secrets:"
            echo "1. Go to Settings > Secrets and variables > Actions"
            echo "2. Create new repository secret: RAILWAY_TOKEN"
            echo "3. Get token from: https://railway.app/account/tokens"
            exit 1
          fi
          
          # Deploy to Railway
          railway up --force --token "$RAILWAY_TOKEN"

      - name: Deployment Status
        if: success()
        run: |
          echo "✅ Deployment to Railway successful!"
          echo "View your app: https://railway.app/dashboard"

      - name: Deployment Failed
        if: failure()
        run: |
          echo "❌ Deployment to Railway failed"
          echo "Check logs above for details"
          exit 1